<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S3 テキスト編集</title>
  <style>
    body { max-width: 800px; margin: 32px auto; padding: 0 16px; font-family: sans-serif; }
    label { display: block; margin: 16px 0 6px; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 8px; font: inherit; }
    textarea { height: 280px; font-family: monospace; }
    button { margin: 16px 8px 0 0; padding: 8px 20px; cursor: pointer; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>S3 テキスト編集</h1>

  <label for="getUrl">GET の署名付き URL</label>
  <input id="getUrl" type="url" placeholder="https://..." spellcheck="false">

  <label for="putUrl">PUT の署名付き URL</label>
  <input id="putUrl" type="url" placeholder="https://..." spellcheck="false">

  <label for="content">テキストファイルの内容</label>
  <textarea id="content" spellcheck="false"></textarea>

  <button id="getButton" type="button">取得して表示</button>
  <button id="putButton" type="button">更新</button>
  <p id="status" role="status" aria-live="polite"></p>

  <script>
    const getUrl = document.getElementById('getUrl');
    const putUrl = document.getElementById('putUrl');
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    const getButton = document.getElementById('getButton');
    const putButton = document.getElementById('putButton');

    async function request(method) {
      const url = (method === 'GET' ? getUrl : putUrl).value.trim();
      if (!url) {
        status.textContent = `${method} の URL を入力してください。`;
        return;
      }

      getButton.disabled = true;
      putButton.disabled = true;
      status.textContent = `${method} 実行中...`;
      try {
        const options = method === 'GET'
          ? { method: 'GET' }
          : { method: 'PUT', body: content.value };
        const response = await fetch(url, options);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText}`);
        }
        if (method === 'GET') {
          content.value = await response.text();
          status.textContent = '取得しました。';
        } else {
          status.textContent = '更新しました。';
        }
      } catch (error) {
        status.textContent = `エラー: ${error.message}`;
      } finally {
        getButton.disabled = false;
        putButton.disabled = false;
      }
    }

    getButton.addEventListener('click', () => request('GET'));
    putButton.addEventListener('click', () => request('PUT'));
  </script>
</body>
</html>
